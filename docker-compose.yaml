version: '3.8'
services:
  mumble:
    build:
      context: .
      dockerfile: dockerfile
    container_name: mumble
    restart: unless-stopped
    environment:
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
    ports:
      - "${PORTS}:${PORTS}/tcp"
      - "${PORTS}:${PORTS}/udp"
    volumes:
      - ${CONFIG_PATH}:/data/config.ini